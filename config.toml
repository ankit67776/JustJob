# Just Job configuration. API keys and tokens go in .env, never here.
# After editing filters, run `python -m justjob refilter` to re-apply them to stored jobs.

[profile]
# Used by the filters, the rule-based ranking and the AI prompt. Edit freely.
summary = "Full-stack / AI engineer with 3+ years of experience: Python, ML and LLM apps (RAG, agents), backend APIs and React frontends."
years_experience = 3.3
max_years_required = 4          # jobs that clearly require more than this are dropped
skills = [
    "python", "pytorch", "tensorflow", "scikit-learn", "machine learning", "deep learning",
    "llm", "rag", "agents", "prompt engineering", "openai", "gemini",
    "fastapi", "django", "node.js", "sql", "rest api", "docker",
    "react", "typescript", "javascript", "next.js",
]
target_roles = ["AI Engineer", "Full Stack Engineer", "Backend Engineer", "ML Engineer", "Software Engineer"]
# Told to the AI. Skills only affect ranking; a job is never dropped for missing skills.
preferences = "Priority: AI engineering first, then full-stack and backend, then frontend. Missing a few listed skills is fine if the overall fit is good."
avoid = ["sales or solutions engineering", "staff, principal or lead roles", "mobile (iOS/Android)"]
# Optional plain-text resume (relative to this folder). Used only by the AI step.
resume_file = "resume.txt"

[filters.title]
# A title passes if it has a role word AND a domain word ("Backend" + "Engineer"),
# or any `standalone` phrase on its own. Matching is case-insensitive, whole words.
role_words = ["engineer", "engineers", "developer", "developers", "scientist", "programmer"]
domain_words = [
    "software", "backend", "back-end", "back end", "full stack", "fullstack", "full-stack", "python",
    "frontend", "front-end", "front end", "web", "ui", "react", "javascript", "typescript", "node",
    "machine learning", "ml", "ai", "ai/ml", "artificial intelligence", "llm", "llms", "genai",
    "generative ai", "deep learning", "nlp", "computer vision", "applied", "research", "inference",
    "model", "models", "agent", "agents", "agentic", "platform", "infrastructure", "data", "mlops",
    "product", "api", "distributed systems", "cloud", "forward deployed", "rag", "systems",
]
standalone = ["swe", "sde", "sde 1", "sde i", "sde 2", "sde ii", "mle", "member of technical staff"]
# Any of these rejects the title.
exclude = [
    "staff", "lead", "principal", "manager", "director", "head", "vp", "vice president",
    "architect", "distinguished", "fellow", "chief", "iv",
    "intern", "internship", "co-op",
    "sales", "solutions engineer", "support", "recruiter", "recruiting", "data center",
    "ios", "android",
]
# These reject the title unless the posting clearly asks for <= max_years_required years
# (some companies call 3-4 year roles "Senior").
exclude_unless_years_fit = ["senior", "sr", "iii"]

[filters.location]
# On-site / hybrid jobs pass only if their location mentions one of these. ["*"] = any.
onsite = [
    "india", "bengaluru", "bangalore", "hyderabad", "pune", "mumbai", "navi mumbai", "delhi",
    "new delhi", "ncr", "gurgaon", "gurugram", "noida", "chennai", "kolkata", "ahmedabad", "kochi",
    "jaipur", "indore", "chandigarh", "coimbatore", "thiruvananthapuram", "trivandrum", "mysore",
    "mysuru", "bhubaneswar", "nagpur", "vadodara", "surat", "lucknow", "visakhapatnam",
]
# Accept remote jobs at all?
remote = true
# Region-locked remote jobs ("Remote - US") pass only if they mention one of these. ["*"] = any.
remote_regions = ["*"]

[ranking]
# Title boosts: AI roles first, then full-stack / backend.
title_top = [
    "ai", "ml", "machine learning", "llm", "llms", "genai", "generative ai", "applied ai",
    "deep learning", "nlp", "agent", "agents", "agentic", "mle",
]
title_next = ["full stack", "fullstack", "full-stack", "backend", "back-end", "back end"]
remote_bonus = 10               # added to every remote job's score (rule or AI)
stale_after_days = 90           # postings older than this...
stale_penalty = 10              # ...lose this many points (old listings rarely respond)

[fetch]
workers = 8                     # boards fetched at once per source (Workday 12, Workable 2 by default)
# Also fetch the thousands of company boards in companies/<ats>.tsv (filled by `harvest`).
registry = true
# Sources that only show recent postings (HN, Remotive, RemoteOK, JSearch, Adzuna) can't tell us
# when a job closes, so their jobs are hidden after this many days.
max_age_days = 30
# Very large Workday boards are fetched newest-first and only partly; their jobs that haven't
# been listed for this many days count as closed.
unseen_days = 7

