enabled = true
country = "in"
queries = ["ai engineer", "machine learning engineer", "full stack developer", "backend developer"]
max_days_old = 3

# --- AI step ------------------------------------------------------------------------------
# Any OpenAI-compatible API works: switch provider by name, or add your own block below.

[ai]
enabled = true                  # only runs when the provider's API key is set in .env
provider = "gemini"
fallback = ["groq"]             # tried in order if the main provider fails or has no key
batch_size = 10                 # jobs per AI call
max_calls_per_run = 30          # cap per run; leftovers are analyzed on the next run
min_interval_seconds = 8        # pause between calls (free tiers have low per-minute limits)
description_chars = 2500        # each description is trimmed to this before sending

[ai.providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-flash-lite-latest"   # fast, generous free tier; `python -m justjob models` lists others
api_key_env = "GEMINI_API_KEY"

[ai.providers.groq]
base_url = "https://api.groq.com/openai/v1"
model = "llama-3.3-70b-versatile"
api_key_env = "GROQ_API_KEY"

[ai.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
model = "meta-llama/llama-3.3-70b-instruct:free"
api_key_env = "OPENROUTER_API_KEY"

# --- Output -------------------------------------------------------------------------------

[digest]
min_score = 0                   # 0 = show every kept job, ranked; raise it to hide weak fits
max_items = 60

[notify]
telegram = false                # needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env
email = false                   # needs SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, EMAIL_TO in .env
max_items = 15                  # how many new matches to include in the message
